name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go vet ./...
      - run: go test -race ./...

  worker-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/xconnect-controller-edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/xconnect-controller-edge/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  container:
    needs: [test, worker-ts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-worker:
    name: Deploy Cloudflare Worker
    needs: [test, worker-ts, container]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: xconnect-controller-edge-prod
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: workers/xconnect-controller-edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/xconnect-controller-edge/package-lock.json
      - run: npm ci
      - name: Authenticate to Vault and fetch Cloudflare credentials
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: ${{ vars.VAULT_CF_DEPLOY_ROLE || 'github-actions-xconnect-controller-prod' }}
          jwtGithubAudience: vault
          secrets: |
            kv/data/prod/serverless/cloudflare CLOUDFLARE_ACCOUNT_ID | CLOUDFLARE_ACCOUNT_ID ;
            kv/data/prod/serverless/cloudflare CLOUDFLARE_API_TOKEN | CLOUDFLARE_API_TOKEN
      - name: Resolve Hyperdrive config and render wrangler.deploy.toml
        id: render
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CONFIGURED_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
        run: |
          set -euo pipefail
          HD_ID="${CONFIGURED_HYPERDRIVE_ID}"
          if [ -z "${HD_ID}" ]; then
            HD_JSON=$(curl -sS --max-time 15 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/hyperdrive/configs" || echo '{}')
            HD_ID=$(node -e '
              const data = JSON.parse(process.argv[1] || "{}");
              const items = Array.isArray(data.result) ? data.result : [];
              const preferred = items.find((item) => item && (item.name === "xconnect-overlay-pg" || item.name === "xconnect-controller-pg"));
              process.stdout.write((preferred && preferred.id) || "");
            ' "${HD_JSON}")
          fi
          CLOUDFLARE_HYPERDRIVE_ID="${HD_ID}" node scripts/render-wrangler-config.mjs
      - name: Deploy xconnect-controller-edge to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOY_LOG=$(mktemp)
          trap 'rm -f "${DEPLOY_LOG}"' EXIT
          npx wrangler deploy --config wrangler.deploy.toml | tee "${DEPLOY_LOG}"
          WORKER_URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' "${DEPLOY_LOG}" | tail -n 1 || true)
          if [ -n "${WORKER_URL}" ]; then
            echo "Verifying ${WORKER_URL}/healthz"
            curl -fsS --retry 6 --retry-delay 3 --retry-all-errors --max-time 15 "${WORKER_URL}/healthz" | grep -q '"runtime":"cloudflare-worker"'
          fi
      - name: Cleanup generated wrangler.deploy.toml
        if: always()
        run: rm -f wrangler.deploy.toml
